[project]
name = "draft-ink-capstone"
version = "0.1.0"
description = "DraftInk Document drafting and writing assistant"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "cryptography>=42.0.0",
    "google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
